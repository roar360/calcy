<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Calculator – snap a bill, get the total</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Kalam&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2f6f3;--rule:#cddbe6;--ink:#1f2a5c;--margin:#c8453f;--mute:#5b6785}
*{box-sizing:border-box}
body{margin:0;font-family:Hind,system-ui,sans-serif;color:var(--ink);background:var(--paper);
background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);line-height:36px}
.page{max-width:560px;margin:0 auto;padding:12px 20px 48px 60px;position:relative;min-height:100vh}
.page::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
h1{font-size:28px;line-height:36px;margin:0;font-weight:700}
p{margin:0}.sub{color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.btn{font:600 16px/1 Hind,sans-serif;padding:13px 18px;border-radius:6px;border:2px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
input[type=file]{display:none}
#left{font-size:14px;color:var(--mute);margin-top:6px}
#preview{display:none;max-width:100%;max-height:220px;border-radius:4px;border:1px solid var(--rule);margin-top:18px}
#status{min-height:36px;color:var(--mute);font-size:15px;margin-top:6px}
label{display:block;font-size:14px;color:var(--mute);margin-top:12px}
#expr{width:100%;font:400 24px/1.3 Kalam,Hind,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:4px 0}
#note{font-size:14px;color:var(--mute);min-height:36px}
.total{margin-top:6px;font-size:52px;line-height:60px;font-weight:700;border-bottom:6px double var(--ink);padding-bottom:4px;word-break:break-all}
details{margin-top:18px}summary{cursor:pointer;font-weight:600}
#eq{font:400 18px/1.5 Kalam,Hind,sans-serif;word-break:break-word;margin:6px 0}
#steps{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#steps td{padding:0;vertical-align:top;line-height:36px}
#steps td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
#steps tr.sum td{font-weight:700;border-top:1px solid var(--ink)}
#ad-banner{margin-top:28px;min-height:90px;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;line-height:1.2}
dialog{border:2px solid var(--ink);border-radius:8px;max-width:360px;padding:20px;background:var(--paper);color:var(--ink);line-height:1.5}
dialog::backdrop{background:rgba(31,42,92,.55)}
#ad-gate{min-height:120px;margin:12px 0;border:1px dashed var(--rule);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main class="page">
  <h1>Photo Calculator</h1>
  <p class="sub">Snap a handwritten bill or sum. Get the total.</p>
  <div class="row">
    <label class="btn" for="cam" tabindex="0">Take photo</label>
    <label class="btn alt" for="gal" tabindex="0">Upload photo</label>
  </div>
  <input id="cam" type="file" accept="image/*" capture="environment">
  <input id="gal" type="file" accept="image/*">
  <p id="left"></p>
  <img id="preview" alt="Your photo">
  <p id="status" role="status" aria-live="polite"></p>

  <label for="expr">What I read (fix it if it’s wrong, or type your own)</label>
  <input id="expr" inputmode="decimal" autocomplete="off" placeholder="450*3+120-15">
  <p id="note"></p>
  <div class="total" id="total" aria-live="polite">0</div>
  <details id="how" open hidden>
    <summary>How this was calculated</summary>
    <p id="eq"></p>
    <table id="steps"></table>
  </details>

  <!-- Paste your Adsterra/AdSense banner code inside this div -->
  <div id="ad-banner">Ad space</div>
</main>

<dialog id="gate">
  <strong>You’ve used your free scans for today.</strong>
  <p>Watch a short ad to get more.</p>
  <!-- Paste your ad code (native banner / social bar) inside this div -->
  <div id="ad-gate">Ad space</div>
  <button class="btn" id="go" disabled>Continue</button>
  <button class="btn alt" id="close">Not now</button>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.min.js"></script>
<script>
const API_URL = "https://photo-calc-api.fkfarhankhan984.workers.dev";
const FREE = 3, BONUS = 3, WAIT = 8;
const $ = id => document.getElementById(id);
let pending = null;

function quota(){
  try{ const q = JSON.parse(localStorage.getItem("pc") || "{}"); if(q.d === today()) return q; }catch{}
  return {d: today(), used: 0, bonus: 0};
}
function today(){ return new Date().toISOString().slice(0,10); }
function save(q){ try{ localStorage.setItem("pc", JSON.stringify(q)); }catch{} }
function left(){ const q = quota(); return FREE + q.bonus - q.used; }
function showLeft(){ const n = left(); $("left").textContent = n + " free scan" + (n === 1 ? "" : "s") + " left today"; }

function calc(){
  $("how").hidden = true;
  const e = $("expr").value.replace(/[×xX]/g,"*").replace(/÷/g,"/").replace(/[₹,\s]/g,"");
  if(!e){ $("total").textContent = "0"; return; }
  if(!/^[0-9+\-*/().^]+$/.test(e)){ $("total").textContent = "—"; $("note").textContent = "Use numbers and + - × ÷ ( ). Write 15% as 15/100."; return; }
  try{
    const v = math.evaluate(e);
    $("total").textContent = (typeof v === "number" && isFinite(v)) ? new Intl.NumberFormat("en-IN",{maximumFractionDigits:2}).format(v) : "—";
    if(typeof v === "number" && isFinite(v)) explain(e, v);
  }catch{ $("total").textContent = "—"; }
}

const fmtN = n => new Intl.NumberFormat("en-IN",{maximumFractionDigits:2}).format(n);
const strip = n => { while(n.type === "ParenthesisNode") n = n.content; return n; };
function show(n){
  if(n.type === "ConstantNode") return fmtN(Number(n.value));
  if(n.type === "ParenthesisNode") return "(" + show(n.content) + ")";
  if(n.type === "OperatorNode"){
    if(n.args.length === 1) return (n.op === "-" ? "−" : n.op) + show(n.args[0]);
    const o = {"+":" + ","-":" − ","*":" × ","/":" ÷ ","^":"^"}[n.op] || n.op;
    return show(n.args[0]) + o + show(n.args[1]);
  }
  return n.toString();
}
function terms(n){
  n = strip(n);
  if(n.type === "OperatorNode" && n.args.length === 2 && (n.op === "+" || n.op === "-")){
    const l = terms(n.args[0]); l.push({s: n.op === "-" ? -1 : 1, n: n.args[1]}); return l;
  }
  return [{s: 1, n}];
}
function explain(e, total){
  try{
    const root = math.parse(e); let top = root, pct = null;
    if(root.type === "OperatorNode" && root.op === "*" && root.args.length === 2){
      const m = strip(root.args[1]);
      if(m.type === "OperatorNode" && (m.op === "-" || m.op === "+") && m.args.length === 2){
        const one = strip(m.args[0]), d = strip(m.args[1]);
        if(one.type === "ConstantNode" && Number(one.value) === 1 && d.type === "OperatorNode" && d.op === "/" &&
           d.args[0].type === "ConstantNode" && d.args[1].type === "ConstantNode" && Number(d.args[1].value) === 100){
          pct = {s: m.op === "-" ? -1 : 1, p: Number(d.args[0].value)}; top = strip(root.args[0]);
        }
      }
    }
    const rows = terms(top).map(t => ({s: t.s, text: show(t.n), v: t.n.evaluate()}));
    if(rows.length < 2 && !pct){ $("how").hidden = true; return; }
    const sub = rows.reduce((a, r) => a + r.s * r.v, 0);
    const eq = pct ? (rows.length > 1 ? "(" + show(top) + ")" : show(top)) + (pct.s < 0 ? " − " : " + ") + fmtN(pct.p) + "%" : show(root);
    $("eq").textContent = eq + " = " + fmtN(total);
    const t = $("steps"); t.replaceChildren();
    const add = (a, b, cls) => { const tr = t.insertRow(); if(cls) tr.className = cls; tr.insertCell().textContent = a; tr.insertCell().textContent = b; };
    rows.forEach((r, i) => {
      const lead = r.s < 0 ? "− " : (i === 0 ? "" : "+ ");
      add(lead + r.text, /^[\d,.]+$/.test(r.text) ? "" : "= " + fmtN(r.v));
    });
    if(pct){
      if(rows.length > 1) add("Subtotal", fmtN(sub), "sum");
      const adj = sub * pct.s * pct.p / 100;
      add((pct.s < 0 ? "− " : "+ ") + fmtN(pct.p) + "% of " + fmtN(sub), (adj < 0 ? "− " : "") + fmtN(Math.abs(adj)));
    }
    add("Total", fmtN(total), "sum");
    $("how").hidden = false;
  }catch{ $("how").hidden = true; }
}

function toJpeg(file, max = 1280){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => rej(new Error("bad image"));
    img.src = u;
  });
}

async function scan(file){
  if(left() <= 0){ pending = file; openGate(); return; }
  $("note").textContent = ""; $("status").textContent = "Reading your photo…";
  try{
    const url = await toJpeg(file);
    $("preview").src = url; $("preview").style.display = "block";
    const r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({image: url.split(",")[1], mime: "image/jpeg"})});
    if(r.status === 429){ $("status").textContent = "Daily limit reached on this network. Try again tomorrow."; return; }
    if(!r.ok) throw new Error("server " + r.status);
    const d = await r.json();
    const q = quota(); q.used++; save(q); showLeft();
    if(!d.expression){ $("status").textContent = "Couldn’t read any numbers. Retake the photo closer and in good light."; return; }
    $("expr").value = d.expression; $("note").textContent = d.note || "";
    $("status").textContent = "Check the numbers above, then use the total."; calc();
  }catch{ $("status").textContent = "Something went wrong. Check your connection and try again."; }
}

function openGate(){
  const b = $("go"); let t = WAIT; b.disabled = true; b.textContent = "Continue in " + t + "s";
  $("gate").showModal();
  const iv = setInterval(() => {
    t--; if(t > 0){ b.textContent = "Continue in " + t + "s"; }
    else{ clearInterval(iv); b.disabled = false; b.textContent = "Get " + BONUS + " more scans"; }
  }, 1000);
}
$("go").onclick = () => {
  const q = quota(); q.bonus += BONUS; save(q); $("gate").close(); showLeft();
  if(pending){ const f = pending; pending = null; scan(f); }
};
$("close").onclick = () => { pending = null; $("gate").close(); };

["cam","gal"].forEach(id => $(id).addEventListener("change", e => { const f = e.target.files[0]; if(f) scan(f); e.target.value = ""; }));
$("expr").addEventListener("input", calc);
showLeft(); calc();
</script>
</body>
</html>
